<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JogFile — Advance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --recurring: #4f46e5;
      --birthday: #db2777;
      --today: #0891b2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: var(--recurring);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      font-size: 14px;
      line-height: 1.35;
      min-height: 100vh;
    }

    body.birthday-mode {
      background: var(--birthday);
    }

    body.empty-mode {
      background: #f0f9ff;
    }

    @media (min-width: 500px) {
      body, body.birthday-mode, body.empty-mode {
        background: #f0f9ff;
      }
    }

    /* Header */
    .header {
      background: white;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      height: 24px;
      width: auto;
    }

    .logo-text {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
    }

    .header-skip {
      color: #64748b;
      text-decoration: none;
      font-weight: 500;
    }

    /* Main */
    .main {
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    @media (min-width: 500px) {
      .main {
        padding: 20px;
      }

      .advance-card {
        max-width: 400px;
        border-radius: 20px;
        overflow: hidden;
      }
    }

    /* Card */
    .advance-card {
      width: 100%;
      color: white;
    }

    .advance-card-recurring {
      background: var(--recurring);
    }

    .advance-card-birthday {
      background: var(--birthday);
    }

    .advance-body {
      padding: 32px 24px;
      text-align: center;
    }

    .advance-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.9;
    }

    .advance-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .advance-subtitle {
      font-size: 15px;
      opacity: 0.85;
      margin-bottom: 4px;
    }

    .advance-pattern {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 8px;
    }

    /* Primary actions */
    .advance-actions {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    .btn {
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex: 1;
    }

    .btn-solid {
      background: white;
      color: var(--recurring);
    }

    .advance-card-birthday .btn-solid {
      color: var(--birthday);
    }

    .btn-ghost {
      background: rgba(255,255,255,0.2);
      color: white;
    }

    /* Schedule section */
    .schedule-section {
      border-top: 1px solid rgba(255,255,255,0.2);
      padding: 16px 24px;
    }

    .schedule-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: rgba(255,255,255,0.8);
      font-size: 14px;
      cursor: pointer;
    }

    .schedule-content {
      display: none;
      margin-top: 16px;
    }

    .schedule-content.show {
      display: block;
    }

    .quick-dates {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .quick-date {
      flex: 1;
      padding: 10px;
      background: rgba(255,255,255,0.15);
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
      cursor: pointer;
    }

    .quick-date:hover {
      background: rgba(255,255,255,0.25);
    }

    .schedule-row {
      display: flex;
      gap: 8px;
    }

    .schedule-input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 14px;
    }

    .schedule-input::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }

    .btn-schedule {
      padding: 12px 16px;
      background: rgba(255,255,255,0.25);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-icon {
      font-size: 64px;
      color: var(--today);
      margin-bottom: 16px;
    }

    .empty-title {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .empty-subtitle {
      color: #64748b;
      margin-bottom: 24px;
    }

    .btn-home {
      display: inline-flex;
      padding: 14px 28px;
      background: var(--today);
      color: white;
      border-radius: 12px;
      font-weight: 600;
      text-decoration: none;
    }

    /* Example switcher (for demo only) */
    .demo-switcher {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: white;
      padding: 8px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .demo-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      background: #f1f5f9;
    }

    .demo-btn.active {
      background: var(--today);
      color: white;
    }
  </style>
</head>
<body>
  <main class="main">
    <!-- Recurring card -->
    <div class="advance-card advance-card-recurring" id="card-recurring">
      <div class="advance-body">
        <div class="advance-icon"><i class="bi bi-arrow-repeat"></i></div>
        <div class="advance-title">Weekly Review</div>
        <div class="advance-subtitle">Review goals and plan the week ahead</div>
        <div class="advance-pattern">Every Monday</div>

        <div class="advance-actions">
          <button class="btn btn-ghost">Skip</button>
          <button class="btn btn-solid">
            <i class="bi bi-plus-lg"></i> Today
          </button>
          <button class="btn btn-ghost">Tomorrow</button>
        </div>
      </div>

      <div class="schedule-section">
        <div class="schedule-toggle" onclick="this.nextElementSibling.classList.toggle('show')">
          <i class="bi bi-calendar-plus"></i>
          <span>Schedule for later</span>
          <i class="bi bi-chevron-down"></i>
        </div>
        <div class="schedule-content">
          <div class="quick-dates">
            <div class="quick-date">Next Week</div>
            <div class="quick-date">Next Month</div>
          </div>
          <div class="schedule-row">
            <input type="date" class="schedule-input">
            <button class="btn-schedule">Schedule</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Birthday card (hidden by default) -->
    <div class="advance-card advance-card-birthday" id="card-birthday" style="display: none;">
      <div class="advance-body">
        <div class="advance-icon"><i class="bi bi-cake2"></i></div>
        <div class="advance-title">James's Birthday!</div>
        <div class="advance-subtitle">Turning 5 today</div>

        <div class="advance-actions">
          <button class="btn btn-solid">Got It</button>
        </div>
      </div>
    </div>

    <!-- Empty state (hidden by default) -->
    <div class="empty-state" id="card-empty" style="display: none;">
      <div class="empty-icon"><i class="bi bi-stars"></i></div>
      <div class="empty-title">All caught up!</div>
      <div class="empty-subtitle">No items to process</div>
      <a href="#" class="btn-home">Go to Today</a>
    </div>
  </main>

  <!-- Demo switcher -->
  <div class="demo-switcher">
    <button class="demo-btn active" onclick="showCard('recurring')">Recurring</button>
    <button class="demo-btn" onclick="showCard('birthday')">Birthday</button>
    <button class="demo-btn" onclick="showCard('empty')">Empty</button>
  </div>

  <script>
    function showCard(type) {
      document.querySelectorAll('.advance-card, .empty-state').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.demo-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('card-' + type).style.display = 'block';
      event.target.classList.add('active');
      
      document.body.classList.remove('birthday-mode', 'empty-mode');
      if (type === 'birthday') document.body.classList.add('birthday-mode');
      if (type === 'empty') document.body.classList.add('empty-mode');
    }
  </script>
</body>
</html>
